services:
  api:
    build:
      context: ./backend
    environment:
      NARYS_INDEX_URL: ${NARYS_INDEX_URL:-https://github.com/NarysAI/narys-index.git}
      NARYS_INDEX_REF: ${NARYS_INDEX_REF:-main}
      NARYS_CACHE_DIR: ${NARYS_CACHE_DIR:-/var/lib/narys}
      NARYS_LOG_LEVEL: ${NARYS_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${NARYS_API_PORT:-8001}:8000"
    volumes:
      - narys-cache:/var/lib/narys
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_URL: "${VITE_API_URL:-}"
    ports:
      - "127.0.0.1:${NARYS_WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  narys-cache:
