services:
  api:
    build:
      context: ./backend
    environment:
      NARYS_INDEX_URL: ${NARYS_INDEX_URL:-https://github.com/NarysAI/narys-index.git}
      NARYS_INDEX_REF: ${NARYS_INDEX_REF:-main}
      NARYS_CACHE_DIR: ${NARYS_CACHE_DIR:-/srv/narys}
      NARYS_PUBLIC_REPO_DIR: /srv/narys/repositories/PUB
      NARYS_PRIVATE_REPO_DIR: /srv/narys/repositories/indra
      NARYS_LOG_LEVEL: ${NARYS_LOG_LEVEL:-INFO}
      NARYS_ENV: ${NARYS_ENV:-development}
    ports:
      - "127.0.0.1:${NARYS_API_PORT:-8001}:8000"
    volumes:
      - ./var:/srv/narys
      - ../PUB:/srv/narys/repositories/PUB:ro
      - ../indra:/srv/narys/repositories/indra:ro
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      start_period: 10m
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_URL: "${VITE_API_URL:-}"
    ports:
      - "127.0.0.1:${NARYS_WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  narys-cache:
